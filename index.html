<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>펭귄 카운팅 클럽</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf7fb;color:#153e50;font-family:system-ui,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}main{max-width:900px;margin:auto;padding:22px 18px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:18px}.tag{background:#fff;border-radius:30px;padding:8px 14px;font-size:13px}h1{font-size:clamp(30px,6vw,48px);line-height:1.2;margin:22px 0 12px}h2{font-size:25px}p{line-height:1.7}.muted{color:#426575}.panel{background:white;border:2px solid #d6eaf0;border-radius:26px;padding:24px;margin-top:20px;box-shadow:0 10px 0 #dceef3}.btn{background:#126d82;color:white;border:0;border-radius:16px;padding:15px 23px;font-size:17px;font-weight:800;cursor:pointer;min-height:48px}.btn:focus-visible,input:focus-visible{outline:4px solid #f4b64a;outline-offset:3px}.secondary{background:#e8f3f7;color:#153e50}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{background:#f1f8fb;border-radius:18px;padding:12px;text-align:center}.card img{width:100%;height:135px;object-fit:contain;background:#e2eff4;border-radius:12px}.card strong{display:block;margin:8px 0}.card small{display:block;line-height:1.5;color:#426575}.steps{display:flex;gap:8px;flex-wrap:wrap}.steps span{background:#edf6f8;padding:9px 12px;border-radius:12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.stage{height:min(53vh,430px);min-height:240px;background:#e8f2f6;border-radius:22px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage img{width:100%;height:100%;object-fit:contain;animation:pop .18s ease-out}.countdown{font-size:80px;font-weight:900}.snow{position:absolute;pointer-events:none;bottom:12px;right:14px;font-size:25px}.progress{height:9px;background:#e1edf1;border-radius:20px;overflow:hidden;margin-top:15px}.progress div{background:#16869c;height:100%;transition:width .15s}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{font-weight:700}input{display:block;width:100%;border:2px solid #a7cbd5;border-radius:12px;padding:13px;font-size:24px;margin:10px 0;background:#fff;color:#153e50}.error{color:#a42a35;font-weight:700}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{padding:12px 6px;text-align:center;border-bottom:1px solid #dce9ee}th{font-size:14px}.badge{display:inline-block;background:#e2f5ed;padding:8px 14px;border-radius:30px}.footer{font-size:12px;color:#426575;margin-top:24px;line-height:1.7}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}@keyframes pop{0%{transform:translateY(13px) scale(.97)}70%{transform:translateY(-3px) scale(1.005)}100%{transform:none}}@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}.mascot{display:inline-block;animation:wiggle 1.5s ease-in-out infinite;font-size:55px}@media(max-width:540px){.panel{padding:17px}.card{padding:8px}.card img{height:100px}.card small{font-size:11px}.inputs{gap:8px}input{padding:10px}.tag{font-size:11px}th,td{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.stage{height:min(43vh,350px);min-height:170px}
.clickbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:sticky;bottom:0;background:#fff;padding:12px 0;z-index:3}
.species-btn{border:2px solid #b7dce6;border-radius:18px;padding:14px 6px;min-height:85px;background:#edf8fc;color:#153e50;font-size:18px;font-weight:800;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.species-btn:nth-child(2){background:#fff3df;border-color:#ebd2a8}.species-btn:nth-child(3){background:#f3edff;border-color:#d8caf1}
.species-btn strong{display:block;font-size:27px;margin-top:3px}.species-btn:active{transform:scale(.94)}.species-btn:focus-visible{outline:4px solid #126d82;outline-offset:2px}
.species-btn.boop{animation:clickpop .18s ease-out}.celebration{position:relative;text-align:center;overflow:hidden;padding:28px 10px;border-radius:22px;background:#eaf7fb}.hero-emoji{font-size:80px;display:inline-block;margin:18px}.celebration h1{font-size:clamp(30px,6vw,44px)}
.win3 .hero-emoji{animation:robot .65s ease-in-out 6}.win2 .hero-emoji{animation:hop .8s ease-in-out 5}.win1 .hero-emoji{animation:award 1s ease-in-out 4}.win0 .hero-emoji{animation:encourage 1.1s ease-in-out 4}
.particle{position:absolute;left:var(--x);top:-35px;font-size:24px;pointer-events:none;animation:fall 2.8s ease-in var(--delay) 1 both}
@keyframes clickpop{50%{transform:scale(.94)}}@keyframes robot{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-15px)}}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px) rotate(8deg)}}@keyframes award{0%,100%{transform:scale(1)}50%{transform:scale(1.16) rotate(-6deg)}}@keyframes encourage{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(430px) rotate(260deg);opacity:0}}
@media(max-width:540px){.species-btn{font-size:16px;padding:10px 4px;min-height:76px}.clickbar{gap:7px}.stage{height:35vh;min-height:150px}}
@media(prefers-reduced-motion:reduce){.particle{display:none}*,*:before,*:after{animation:none!important;transition:none!important}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeSequence(n){let kinds=[0,1,2];while(kinds.length<n)kinds.push(Math.floor(Math.random()*3));return shuffle(kinds).map(s=>{const pool=PHOTOS.filter(p=>p.species===s);return pool[Math.floor(Math.random()*pool.length)]})}
function home(){cancelAnimationFrame(raf);phase='home';app.innerHTML=`<section class="panel"><span class="mascot" aria-hidden="true">🐧</span><h1>펭귄을 보면, 바로 클릭!</h1><p>사진 속 펭귄을 보고 <b>아델리 · 젠투 · 턱끈</b>중 맞는 종의 버튼을 사진이 나올 때마다 한 번씩 누르세요.<br>3단계로 갈수록 빨라집니다. 정답은 모든 단계가 끝나면 공개!</p><div class="cards">${names.map((n,s)=>`<div class="card"><img src="${PHOTOS.find(p=>p.species===s).src}" alt="${n} 펭귄 기준 사진"><strong>${n}</strong><small>${['검은 머리 + 흰 눈테','주황빛 부리 + 눈 위 흰 무늬','턱 아래 가느다란 검은 선'][s]}</small></div>`).join('')}</div><div class="steps">${levels.map((l,i)=>`<span>${i+1}단계 · ${l.n}장 · ${(l.ms/1000).toFixed(2)}초/장</span>`).join('')}</div><p class="muted">사진은 매번 무작위로 섞여요. 종 이름은 재생 중에 보이지 않아요.<br>세 버튼은 재생 내내 보여요. 클릭할 때마다 1씩 올라가며 취소는 없어요.<br>세 종의 클릭 수가 실제 마릿수와 모두 같으면 단계 성공!</p><button class="btn" id="start">도전 시작 🐾</button></section>`;document.getElementById('start').onclick=()=>{round=0;records=[];intro()}}
function intro(){phase='intro';const l=levels[round];app.innerHTML=`<section class="panel"><span class="mascot">${l.emoji}</span><h1>${round+1}단계 · ${l.label}</h1><p>총 <b>${l.n}장</b> · 사진당 <b>${l.ms/1000}초</b><br>사진이 나올 때마다 맞는 종 버튼을 한 번 누르세요.</p><p class="muted">준비가 되면 시작하세요. 화면을 벗어나면 자동으로 잠시 멈춥니다.</p><button class="btn" id="go">준비 완료!</button></section>`;document.getElementById('go').onclick=play}
function play(){seq=makeSequence(levels[round].n);truth=names.map((_,s)=>seq.filter(p=>p.species===s).length);index=0;clicks=[0,0,0];count=3;left=1000;paused=false;phase='countdown';app.innerHTML=`<section class="panel"><div class="topline"><b>${round+1}단계 · ${levels[round].label}</b><button class="btn secondary" id="pause">잠깐 멈춤</button></div><div class="stage" id="stage" aria-label="펭귄 사진 재생 영역"></div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="clickbar" aria-label="펭귄 종별 클릭 버튼">${names.map((n,s)=>`<button class="species-btn" id="species${s}" disabled>${n}<strong id="click${s}">0</strong><small>클릭</small></button>`).join('')}</div><p id="status" class="muted">3초 후 시작! 사진마다 맞는 종을 한 번 클릭하세요.</p></section>`;names.forEach((_,s)=>{document.getElementById('species'+s).onclick=()=>{if(phase!=='playing'||paused||document.hidden)return;clicks[s]++;document.getElementById('click'+s).textContent=clicks[s];const b=document.getElementById('species'+s);b.classList.remove('boop');void b.offsetWidth;b.classList.add('boop')}});document.getElementById('pause').onclick=()=>{paused=!paused;syncButtons();document.getElementById('pause').textContent=paused?'계속 보기':'잠깐 멈춤';if(paused)document.getElementById('stage').innerHTML='<div class="countdown">⏸</div>';else renderFrame()};renderFrame();last=performance.now();raf=requestAnimationFrame(tick)}
function syncButtons(){names.forEach((_,s)=>{const b=document.getElementById('species'+s);if(b)b.disabled=phase!=='playing'||paused||document.hidden})}
function renderFrame(){syncButtons();const el=document.getElementById('stage');if(phase==='countdown'){el.innerHTML=`<div class="countdown">${count}</div>`}else if(phase==='playing'){el.innerHTML=`<img src="${seq[index].src}" alt="분류할 펭귄 사진"><span class="snow" aria-hidden="true">❄️</span>`;document.getElementById('status').textContent=`${index+1} / ${seq.length} 장 · 맞는 종 버튼을 한 번 클릭하세요!`;document.getElementById('bar').style.width=((index+1)/seq.length*100)+'%'}}
function tick(now){const dt=Math.min(now-last,100);last=now;if(!paused&&!document.hidden){left-=dt;if(left<=0){if(phase==='countdown'){count--;if(count===0){phase='playing';left=levels[round].ms}else left=1000;renderFrame()}else if(phase==='playing'){index++;if(index>=seq.length){answer();return}left=levels[round].ms;renderFrame()}}}raf=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(phase==='playing'||phase==='countdown')&&!paused){paused=true;syncButtons();document.getElementById('pause').textContent='계속 보기';document.getElementById('stage').innerHTML='<div class="countdown">⏸</div>'}});
function answer(){phase='answer';records.push({truth:[...truth],values:[...clicks]});app.innerHTML=`<section class="panel"><span class="mascot">🐾</span><h1>${round+1}단계 완료!</h1><p>클릭 기록이 저장되었어요. 정답은 세 단계가 끝난 뒤 한 번에 공개해요.</p><div class="cards">${names.map((n,s)=>`<div class="card"><strong>${n}</strong><h2>${clicks[s]}회</h2></div>`).join('')}</div><button class="btn" id="next">${round===2?'최종 결과 보기 🎉':'다음 단계로 →'}</button></section>`;document.getElementById('next').onclick=()=>{if(round<2){round++;intro()}else results()}}
function stageWon(r){return r.truth.every((n,s)=>n===r.values[s])}
function awardFor(wins){return [
{title:'괜찮아요, 이제 학습 시작!',emoji:'🐣🐧',text:'첫 탐사 완료! 특징을 다시 살펴보고 한 번 더 도전해요.',bits:['❄️','💙','🌱']},
{title:'펭귄 탐정 입문!',emoji:'🐧🔎',text:'1단계 성공! 관찰력이 반짝이기 시작했어요.',bits:['⭐','❄️','🔎']},
{title:'AI급 눈썰미예요!',emoji:'🐧🏅',text:'2단계 성공! 남극의 에이스, 완벽까지 한 걸음이에요.',bits:['⭐','🏅','✨']},
{title:'당신은 AI군요!',emoji:'🤖🐧',text:'3단계 모두 성공! 로봇 펭귄도 깜짝 놀랐어요.',bits:['🎉','⭐','💙','✨']}
][wins]}
function results(){phase='results';const wins=records.filter(stageWon).length,award=awardFor(wins);let hits=0;records.forEach(r=>r.truth.forEach((v,s)=>{if(v===r.values[s])hits++}));app.innerHTML=`<section class="panel"><div class="celebration win${wins}">${Array.from({length:20},(_,i)=>`<span class="particle" aria-hidden="true" style="--x:${(i*37)%100}%;--delay:${(i%6)*.16}s">${award.bits[i%award.bits.length]}</span>`).join('')}<div class="hero-emoji" aria-hidden="true">${award.emoji}</div><h1>${award.title}</h1><p>${award.text}</p><span class="badge">${wins} / 3단계 성공 · 종별 클릭 수 ${hits} / 9개 일치</span></div><p>각 단계에서 <b>세 종의 클릭 수가 모두 정답과 같으면 성공</b>이에요.<br>클릭 수 합계만 비교하므로, 서로 다른 사진에서의 실수가 상쇄될 수도 있어요. 사진별 분류 정확도를 나타내는 점수는 아닙니다.</p>${records.map((r,i)=>`<h2>${i+1}단계 · ${stageWon(r)?'✅ 성공':'🐾 도전 완료'}</h2><table><thead><tr><th scope="col">종</th><th scope="col">내 클릭 수</th><th scope="col">정답 마릿수</th><th scope="col">비교</th></tr></thead><tbody>${names.map((n,s)=>`<tr><th scope="row">${n}</th><td>${r.values[s]}</td><td>${r.truth[s]}</td><td>${r.values[s]===r.truth[s]?'✅ 일치':r.values[s]>r.truth[s]?`${r.values[s]-r.truth[s]}회 많음`:`${r.truth[s]-r.values[s]}회 부족`}</td></tr>`).join('')}</tbody></table>`).join('')}<h2>사진이 1만 장이라면?</h2><p>속도가 빨라질 때 <b>종을 구별하는 일</b>과 <b>제때 클릭하는 일</b> 중 무엇이 더 어려웠나요?<br>AI가 자동으로 분류하고 센다면 무엇이 편해질까요? 새로운 각도와 배경에서도 잘 작동할까요?</p><p class="muted">축하 문구는 게임 속 칭찬이에요. 실제 AI 능력을 판정하는 검사는 아닙니다. AI도 오류가 있으며, 같은 사진을 반복한 이 게임은 새 데이터에 대한 모델 평가가 아닙니다.</p><div class="actions"><button class="btn" id="again">새 순서로 다시 도전 🐧</button></div></section>`;document.getElementById('again').onclick=home;window.scrollTo({top:0,behavior:'smooth'})}
Promise.all(PHOTOS.map(p=>new Promise(resolve=>{const im=new Image();im.onload=resolve;im.onerror=resolve;im.src=p.src}))).then(home);app.innerHTML='<section class="panel"><h1>펭귄 친구들이 오는 중… 🐧</h1></section>';
</script></body></html>
